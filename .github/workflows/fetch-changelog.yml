name: Fetch OpenHanako Changelog

on:
  schedule:
    - cron: '0 0 * * *'    # 08:00 Beijing
    - cron: '0 4 * * *'    # 12:00 Beijing
    - cron: '0 10 * * *'   # 18:00 Beijing
    - cron: '0 15 * * *'   # 23:00 Beijing
  workflow_dispatch:
    inputs:
      force_bot:
        description: '强制使用某个 bot (A=香港记者, B=doro, 默认按时间自动)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - A
          - B

env:
  REPO: liliMozi/openhanako
  ISSUE_TITLE: OpenHanako 更新日志
  LABEL: changelog

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      models: read
    steps:
      - uses: actions/checkout@v4

      - name: Get cached last SHA
        id: cache
        run: echo "sha=$(cat last_sha.txt 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Fetch commits from openhanako
        id: commits
        run: |
          SINCE="${{ steps.cache.outputs.sha }}"
          if [ -z "$SINCE" ]; then
            gh api "repos/$REPO/commits?per_page=30" > commits.json
          else
            gh api "repos/$REPO/commits?since=${SINCE}&per_page=30" > commits.json
          fi
          COUNT=$(jq 'length' commits.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "newest=$(jq -r '.[0].sha' commits.json)" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if no updates
        if: steps.commits.outputs.count == '0'
        run: echo "No new commits, nothing to do"

      - name: Build raw changelog
        if: steps.commits.outputs.count != '0'
        run: |
          jq -r '.[] | "\(.sha[0:7]) \(.commit.committer.date[0:19]) \(.commit.author.name): \(.commit.message | split("\n")[0])"' commits.json > raw.txt

      - name: Translate via GitHub Models
        if: steps.commits.outputs.count != '0'
        id: translate
        run: |
          TXT=$(cat raw.txt)
          PAYLOAD=$(jq -n \
            --arg model "gpt-4o-mini" \
            --arg system "You are a changelog summarizer. Group commits into sections: ### 修复, ### 新功能, ### 测试, ### 其他. Translate each message into natural spoken Chinese. Keep SHA prefix. At the end, add a short summary paragraph starting with **更新要点**: Output text only." \
            --arg user "$TXT" \
            '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: $user}], temperature: 0.3, max_tokens: 2000}')
          HTTP_CODE=$(curl -s -w "%{http_code}" -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d "$PAYLOAD" -o response.json)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: API returned $HTTP_CODE"
            echo "（翻译失败）" > translated.txt
          else
            jq -r '.choices[0].message.content' response.json > translated.txt
            RESULT=$(cat translated.txt)
            if [ "$RESULT" = "null" ] || [ -z "$RESULT" ]; then
              echo "（翻译失败）" > translated.txt
            fi
          fi

      - name: Append to changelog and update cache
        if: steps.commits.outputs.count != '0'
        run: |
          SHELL_TZ=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
          {
            echo ""
            echo "***"
            echo "### $SHELL_TZ"
            echo ""
            cat translated.txt
          } >> changelog.md
          echo "${{ steps.commits.outputs.newest }}" > last_sha.txt

      - name: Trim to last 8 and fix front matter
        if: steps.commits.outputs.count != '0'
        run: |
          LIMIT=8
          SEP_COUNT=$(grep -c '^\*\*\*$' changelog.md)
          if [ "$SEP_COUNT" -gt "$LIMIT" ]; then
            SKIP=$((SEP_COUNT - LIMIT))
            awk -v skip="$SKIP" '/^\*\*\*$/{c++; if(c>skip){p=1}} p{print}' changelog.md > .trim.tmp
            mv .trim.tmp changelog.md
          fi
          # Ensure valid YAML front matter so GitHub viewer doesn't error
          if [ "$(head -1 changelog.md | tr -d '\r')" != "---" ]; then
            ( echo '---'; echo '---'; cat changelog.md ) > .front.tmp
            mv .front.tmp changelog.md
          fi

      - name: Commit and push
        if: steps.commits.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md last_sha.txt
          TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
          git commit -m "changelog $TIME" || true
          git push

      - name: Push to pinned issue (email backup)
        if: steps.commits.outputs.count != '0'
        run: |
          TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
          CONTENT=$(cat translated.txt)
          BODY=$(printf '## OpenHanako Changelog\n\nLatest (%s):\n\n%s\n\n---\nFull history: changelog.md in repo\n' "$TIME" "$CONTENT")
          ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$ISSUE" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$BODY" --label "$LABEL"
          else
            gh issue edit "$ISSUE" --body "$BODY"
            gh issue comment "$ISSUE" --body "$BODY"
            # Delete old comments, keep only the newest
            gh api "repos/${{ github.repository }}/issues/$ISSUE/comments" --jq '.[:-1].[].id' | while read id; do
              gh api "repos/${{ github.repository }}/issues/comments/$id" -X DELETE > /dev/null 2>&1 || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to QQ
        if: steps.commits.outputs.count != '0'
        run: |
          FORCE="${{ inputs.force_bot }}"
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          if [ "$FORCE" = "A" ]; then
            APP_ID="${{ secrets.QQ_A_APP_ID }}"
            CLIENT_SECRET="${{ secrets.QQ_A_CLIENT_SECRET }}"
            OPENID="${{ secrets.QQ_A_OPENID }}"
            echo "Force bot: A"
          elif [ "$FORCE" = "B" ]; then
            APP_ID="${{ secrets.QQ_B_APP_ID }}"
            CLIENT_SECRET="${{ secrets.QQ_B_CLIENT_SECRET }}"
            OPENID="${{ secrets.QQ_B_OPENID }}"
            echo "Force bot: B"
          elif [ "$HOUR" = "08" ] || [ "$HOUR" = "18" ]; then
            APP_ID="${{ secrets.QQ_A_APP_ID }}"
            CLIENT_SECRET="${{ secrets.QQ_A_CLIENT_SECRET }}"
            OPENID="${{ secrets.QQ_A_OPENID }}"
            echo "Auto select: 香港记者 (hour=$HOUR)"
          else
            APP_ID="${{ secrets.QQ_B_APP_ID }}"
            CLIENT_SECRET="${{ secrets.QQ_B_CLIENT_SECRET }}"
            OPENID="${{ secrets.QQ_B_OPENID }}"
            echo "Auto select: doro (hour=$HOUR)"
          fi

          echo "Getting OAuth token for bot $APP_ID..."
          AUTH_RESP=$(curl -s -X POST "https://bots.qq.com/app/getAppAccessToken" \
            -H "Content-Type: application/json" \
            -d "{\"appId\":\"$APP_ID\",\"clientSecret\":\"$CLIENT_SECRET\"}")
          ACCESS_TOKEN=$(echo "$AUTH_RESP" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "OAuth failed, response:"
            echo "$AUTH_RESP" | head -c 300
            exit 0
          fi

          TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
          CONTENT=$(cat translated.txt)
          MSG=$(printf 'OpenHanako 更新 (%s):\n\n%s' "$TIME" "$CONTENT")
          MSG=$(echo "$MSG" | head -c 3500)

          echo "Sending to OPENID=$OPENID ..."
          SEND_RESP=$(curl -s -X POST "https://api.sgroup.qq.com/v2/users/$OPENID/messages" \
            -H "Authorization: QQBot $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"content\":$(echo "$MSG" | jq -Rs .),\"msg_type\":0}")
          echo "Send result: $(echo "$SEND_RESP" | jq -c '.')"
          echo "HTTP code: $(echo "$SEND_RESP" | jq -r '.code // \"no code\"')"
