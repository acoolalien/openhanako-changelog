name: Fetch OpenHanako Changelog

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  OPENHANAKO_REPO: liliMozi/openhanako

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Get cached last SHA
        id: cache
        run: echo "sha=$(cat last_sha.txt 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Fetch new commits
        id: commits
        run: |
          SINCE="${{ steps.cache.outputs.sha }}"
          if [ -z "$SINCE" ]; then
            gh api "repos/$OPENHANAKO_REPO/commits?per_page=30" > commits.json
          else
            gh api "repos/$OPENHANAKO_REPO/commits?since=${SINCE}&per_page=30" > commits.json
          fi
          COUNT=$(jq 'length' commits.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "newest=$(jq -r '.[0].sha' commits.json)" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No updates, exit
        if: steps.commits.outputs.count == '0'
        run: echo "No new commits, nothing to do"

      - name: Build raw changelog
        if: steps.commits.outputs.count != '0'
        id: raw
        run: |
          jq -r '.[] | "\(.sha[0:7]) \(.commit.committer.date[0:19]) \(.commit.author.name): \(.commit.message | split("\n")[0])"' commits.json > raw_changelog.txt

      - name: Translate via GitHub Models
        if: steps.commits.outputs.count != '0'
        run: |
          PROMPT="将以下 OpenHanako 项目的 git commit 逐条翻译成中文（保留 SHA 前缀）：
$(cat raw_changelog.txt)"
          jq -n \
            --arg model "gpt-4o-mini" \
            --arg system "你是一个翻译助手。将 git commit 日志逐条翻译成中文，保留每条的 SHA 前缀和结构。直接输出翻译结果，不要加任何额外说明。" \
            --arg user "$PROMPT" \
            '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: $user}], temperature: 0.3, max_tokens: 2000}' \
            | curl -s -X POST "https://models.inference.ai.azure.com/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -d @- > response.json
          jq -r '.choices[0].message.content' response.json > translated.md
          echo "translated<<EOF" >> "$GITHUB_OUTPUT"
          cat translated.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update changelog file and cache
        if: steps.commits.outputs.count != '0'
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
          {
            echo ""
            echo "---"
            echo "### 🕐 $TIMESTAMP"
            echo ""
            cat translated.md
          } >> changelog.md
          echo "${{ steps.commits.outputs.newest }}" > last_sha.txt

      - name: Commit and push
        if: steps.commits.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md last_sha.txt
          git commit -m "Update changelog $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" || true
          git push

      - name: Update pinned issue
        if: steps.commits.outputs.count != '0'
        run: |
          BODY=$(cat <<ISSUE_BODY
## OpenHanako 更新日志

最新更新（$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')）：

$(cat translated.md)

---

完整历史见 [changelog.md](https://github.com/${{ github.repository }}/blob/main/changelog.md)
ISSUE_BODY
)
          ISSUE=$(gh issue list --label changelog --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$ISSUE" ]; then
            gh issue create --title "OpenHanako 更新日志" --body "$BODY" --label "changelog" | grep -oP '\d+$' > issue_num.txt
            gh issue pin "$(cat issue_num.txt)"
          else
            gh issue edit "$ISSUE" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
